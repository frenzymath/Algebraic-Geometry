<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" role="img"
     aria-label="Stacks Project Part 8 — Topics in Moduli Theory">
  <defs>
    <linearGradient id="sp8-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c332a"/>
      <stop offset="100%" stop-color="#0f1e18"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#sp8-bg)"/>
  <rect x="0" y="0" width="14" height="600" fill="#0b0f12"/>
  <rect x="42" y="54" width="316" height="2" fill="#9ad0b0"/>
  <rect x="42" y="546" width="316" height="2" fill="#9ad0b0"/>

  <text x="42" y="96" fill="#9ad0b0" font-family="DejaVu Sans, sans-serif"
        font-size="14" letter-spacing="2.5">THE STACKS PROJECT</text>

  <text fill="#f4f7f9" font-family="DejaVu Serif, Georgia, serif" font-size="42" font-weight="bold">
    <tspan x="42" y="210">Part 8</tspan>
  </text>
  <text fill="#e8eef3" font-family="DejaVu Serif, Georgia, serif" font-size="26">
    <tspan x="42" y="262">Topics in Moduli</tspan>
    <tspan x="42" y="298">Theory</tspan>
  </text>

  <!-- stacked layers motif -->
  <g fill="none" stroke="#9ad0b0" stroke-width="2" opacity="0.9">
    <rect x="70" y="400" width="200" height="28" rx="3"/>
    <rect x="85" y="428" width="200" height="28" rx="3"/>
    <rect x="100" y="456" width="200" height="28" rx="3"/>
  </g>

  <text fill="#d5dee6" font-family="DejaVu Sans, sans-serif" font-size="15">
    <tspan x="42" y="520">stacks.math.columbia.edu</tspan>
  </text>
</svg>
