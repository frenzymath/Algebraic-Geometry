<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" role="img"
     aria-label="Algebraic Jacobian Challenge rebuild route">
  <defs>
    <linearGradient id="jcr-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24364f"/>
      <stop offset="100%" stop-color="#121c2b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#jcr-bg)"/>
  <rect x="0" y="0" width="14" height="600" fill="#0a1018"/>
  <rect x="42" y="54" width="316" height="2" fill="#8eb6e0"/>
  <rect x="42" y="546" width="316" height="2" fill="#8eb6e0"/>

  <text x="42" y="96" fill="#8eb6e0" font-family="DejaVu Sans, sans-serif"
        font-size="14" letter-spacing="2.5">AI4MATH · REBUILD ROUTE</text>

  <text fill="#f5f8fc" font-family="DejaVu Serif, Georgia, serif" font-size="32" font-weight="bold">
    <tspan x="42" y="196">Jacobian</tspan>
    <tspan x="42" y="240">Challenge</tspan>
  </text>
  <text fill="#c5d7ec" font-family="DejaVu Serif, Georgia, serif" font-size="22">
    <tspan x="42" y="286">rebuild route</tspan>
  </text>

  <!-- dependency chain: C → Pic → Alb → Jac -->
  <g font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e8f0fa">
    <rect x="52" y="350" width="70" height="36" rx="6" fill="none" stroke="#8eb6e0" stroke-width="1.5"/>
    <text x="74" y="373">C</text>
    <path d="M 128 368 H 152" stroke="#8eb6e0" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="132" y="362" fill="#8eb6e0" font-size="14">→</text>

    <rect x="158" y="350" width="70" height="36" rx="6" fill="none" stroke="#8eb6e0" stroke-width="1.5"/>
    <text x="172" y="373">Pic</text>
    <text x="236" y="362" fill="#8eb6e0" font-size="14">→</text>

    <rect x="258" y="350" width="70" height="36" rx="6" fill="none" stroke="#8eb6e0" stroke-width="1.5"/>
    <text x="272" y="373">Alb</text>
  </g>
  <g font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e8f0fa">
    <text x="188" y="412" fill="#8eb6e0" font-size="18">↓</text>
    <rect x="158" y="424" width="90" height="36" rx="6" fill="none" stroke="#b7d2ef" stroke-width="1.8"/>
    <text x="178" y="447">Jac</text>
  </g>

  <text fill="#d5e3f2" font-family="DejaVu Sans, sans-serif" font-size="15">
    <tspan x="42" y="500">Explicit formalization dependencies</tspan>
  </text>
