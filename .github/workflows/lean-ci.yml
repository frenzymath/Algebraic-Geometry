# Generated by `palimpsest ci workflow --write`.
# Pull requests consume shared artifacts; only the protected branch publishes them.
name: Lean CI

on:
  push:
    branches: ["palimpsest/aglib"]
  pull_request:
    branches: ["palimpsest/aglib"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lake-build:
    name: lake-build
    runs-on: "ubuntu-latest"
    timeout-minutes: 120
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Derive shared cache keys
        id: cache-key
        shell: bash
        run: |
          set -euo pipefail
          inputs=(AGLib/lean-toolchain AGLib/lake-manifest.json)
          for input in "${inputs[@]}"; do test -s "$input"; done
          fingerprint=$(sha256sum "${inputs[@]}" | sha256sum | cut -d' ' -f1)
          platform=$(uname -s)-$(uname -m)
          generation=$(date -u +%G-W%V)
          output="${GITHUB_OUTPUT:-${GITEA_OUTPUT:-/tmp/palimpsest-ci-output}}"
          echo "dependency-key=lake-deps-$platform-$fingerprint" >> "$output"
          echo "build-key=lake-build-$platform-$fingerprint-$generation" >> "$output"
          echo "build-prefix=lake-build-$platform-$fingerprint-" >> "$output"

      - name: Detect the shared Actions cache
        id: cache-availability
        shell: bash
        run: |
          set -euo pipefail
          output="${GITHUB_OUTPUT:-${GITEA_OUTPUT:-/tmp/palimpsest-ci-output}}"
          if [[ -n "${ACTIONS_CACHE_URL:-}${ACTIONS_RESULTS_URL:-}" ]]; then
            echo "enabled=true" >> "$output"
          else
            echo "enabled=false" >> "$output"
            echo "::notice::No Actions cache endpoint; continuing with an uncached build"
          fi

      - name: Restore manifest-keyed dependency artifacts
        id: dependency-cache
        if: steps.cache-availability.outputs.enabled == 'true'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            AGLib/.lake/packages
          key: ${{ steps.cache-key.outputs.dependency-key }}

      - name: Restore rotating protected-branch build artifacts
        id: build-cache
        if: steps.cache-availability.outputs.enabled == 'true'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            AGLib/.lake/build
          key: ${{ steps.cache-key.outputs.build-key }}
          restore-keys: ${{ steps.cache-key.outputs.build-prefix }}

      - name: Download missing upstream Lean artifacts
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          projects=(AGLib)
          for project in "${projects[@]}"; do
            if ! (cd "$project" && lake exe cache get); then
              echo "::warning::No upstream Lake cache was available for $project"
            fi
          done

      - name: Build every configured Lean project
        shell: bash
        run: |
          set -euo pipefail
          projects=(AGLib)
          for project in "${projects[@]}"; do
            (cd "$project" && lake build)
          done

      - name: Publish manifest-keyed dependency artifacts
        if: steps.cache-availability.outputs.enabled == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/palimpsest/aglib' && steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            AGLib/.lake/packages
          key: ${{ steps.cache-key.outputs.dependency-key }}

      - name: Publish rotating protected-branch build artifacts
        if: steps.cache-availability.outputs.enabled == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/palimpsest/aglib' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            AGLib/.lake/build
          key: ${{ steps.cache-key.outputs.build-key }}
