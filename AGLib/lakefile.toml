name = "AGLib"
version = "0.1.0"
description = "A mathlib-style algebraic geometry library"
keywords = ["math", "algebraic geometry"]
license = "Apache-2.0"
licenseFiles = ["../LICENSE"]
defaultTargets = ["AGLib"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[lean_lib]]
name = "AGLib"
