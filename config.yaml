# Workspace manifest for the Algebraic Geometry site.
# `hgraph sync`, `hgraph site`, and `hgraph serve` auto-detect this file.
# `root:` names both a project's directory and its hash route in the site.
# `category:` groups the cards under a heading, in order of first appearance.
#
# image: is a cover, relative to this file; it is inlined into the page and
# downscaled to card size on the way in. `image_fit: contain` shows the whole
# cover — the card panel is landscape and a cover is portrait, so the default
# `cover` fit would crop it down to a band.
title: Algebraic Geometry
tab_title: Algebraic Geometry
subtitle: Shared infrastructure, source-faithful references, and flagship formalizations
overview: overview.html
stylesheet: site/algebraic-geometry.css
repo: frenzymath/Algebraic-Geometry
theme:
  accent: '#5B9BD5'

categories:
  Algebraic Jacobian: Flagship Jacobian constructions and their alternative formalization routes.
  Moduli: Picard, Hilbert, Quot, and compactification references.
  Stacks: Official Stacks Project Parts 1–8, with each part collecting its chapters.
  Abelian Varieties: Geometry, duality, and arithmetic of abelian varieties.
  Curves and Riemann-Roch: Curves, divisors, differentials, and Riemann-Roch.
  Commutative Algebra: Ring-theoretic foundations for algebraic geometry.
  Category Theory: Categorical foundations for representability and moduli.
  Abelian Varieties and Motives: Source-derived paper blueprints on abelian varieties and motives.
  Curves and Linear Series: Source-derived paper blueprints on curves, syzygies, and linear series.
  Sheaves and Cohomology: Source-derived paper blueprints on sheaves, cohomology, and intersection theory.
  Arithmetic Geometry: Source-derived paper blueprints in arithmetic geometry and number theory.
  Moduli, Higgs Bundles, and Character Varieties: Source-derived paper blueprints on moduli and character varieties.
  Surfaces, Birational Geometry, and Hyper-Kähler Varieties: Source-derived paper blueprints on surfaces and birational geometry.

