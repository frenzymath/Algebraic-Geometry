name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned hgraph
        run: pip install "hgraph @ git+https://github.com/AxelDlv00/hgraph.git@d2e1fe51ea90e5854d689c4cebf26d00294e3190"

      - name: Validate planned workspace
        run: hgraph sync --manifest config.yaml

      - name: Build static hgraph site
        run: |
          hgraph site --manifest config.yaml --out _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
