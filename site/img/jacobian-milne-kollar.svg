<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" role="img"
     aria-label="Algebraic Jacobian Challenge">
  <defs>
    <linearGradient id="jc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a4a"/>
      <stop offset="100%" stop-color="#0d222c"/>
    </linearGradient>
    <linearGradient id="jc-curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ec8e3"/>
      <stop offset="100%" stop-color="#5B9BD5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#jc-bg)"/>
  <rect x="0" y="0" width="14" height="600" fill="#08151b"/>
  <rect x="42" y="54" width="316" height="2" fill="#7ec8e3"/>
  <rect x="42" y="546" width="316" height="2" fill="#7ec8e3"/>

  <text x="42" y="96" fill="#7ec8e3" font-family="DejaVu Sans, sans-serif"
        font-size="14" letter-spacing="2.5">AI4MATH · FLAGSHIP</text>

  <text fill="#f4fafc" font-family="DejaVu Serif, Georgia, serif" font-size="34" font-weight="bold">
    <tspan x="42" y="200">Algebraic</tspan>
    <tspan x="42" y="244">Jacobian</tspan>
    <tspan x="42" y="288">Challenge</tspan>
  </text>

  <!-- stylized smooth curve C -->
  <path d="M 70 390 C 110 320, 150 460, 200 380 S 290 320, 330 400"
        fill="none" stroke="url(#jc-curve)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Jacobian torus suggestion: two nested ellipses -->
  <ellipse cx="200" cy="430" rx="78" ry="28" fill="none" stroke="#5B9BD5" stroke-width="2" opacity="0.85"/>
  <ellipse cx="200" cy="430" rx="42" ry="15" fill="none" stroke="#9ad0ea" stroke-width="1.6" opacity="0.7"/>
  <circle cx="278" cy="430" r="3.5" fill="#cfeaf6"/>
  <text x="292" y="434" fill="#9ad0ea" font-family="DejaVu Serif, Georgia, serif" font-size="16">Jac(C)</text>

  <text fill="#d7ebf4" font-family="DejaVu Sans, sans-serif" font-size="15">
    <tspan x="42" y="500">Picard · Albanese · Jacobian</tspan>
  </text>
</svg>
